<svg xmlns="http://www.w3.org/2000/svg" width="710" height="292" viewBox="0 0 710 292"><rect width="100%" height="100%" fill="white"/><text x="355" y="25" font-family="serif" font-size="17" text-anchor="middle" fill="#172b40">Nonnegativity confines a near-optimal direction to two levels</text><line x1="80" y1="185" x2="640" y2="185" stroke="#334155" stroke-width="1.5" stroke-dasharray=""/><line x1="135" y1="63" x2="135" y2="195" stroke="#8a9aa8" stroke-width="1" stroke-dasharray="4,4"/><line x1="575" y1="63" x2="575" y2="195" stroke="#8a9aa8" stroke-width="1" stroke-dasharray="4,4"/><path d="M 135 185 Q 355 -75 575 185" fill="none" stroke="#527e9d" stroke-width="2.5"/><circle cx="135" cy="185" r="5" fill="#a24737"/><circle cx="147" cy="185" r="5" fill="#a24737"/><circle cx="163" cy="185" r="5" fill="#a24737"/><circle cx="548" cy="185" r="5" fill="#a24737"/><circle cx="567" cy="185" r="5" fill="#a24737"/><circle cx="575" cy="185" r="5" fill="#a24737"/><text x="135" y="216" font-family="serif" font-size="17" text-anchor="middle" fill="#172b40">−α</text><text x="575" y="216" font-family="serif" font-size="17" text-anchor="middle" fill="#172b40">β</text><text x="355" y="246" font-family="serif" font-size="18" text-anchor="middle" fill="#172b40">Σ (vᵢ + α)(β − vᵢ) = nαβ − 1</text><text x="355" y="273" font-family="serif" font-size="15" text-anchor="middle" fill="#172b40">A small nonnegative sum forces every coordinate close to an endpoint.</text></svg>